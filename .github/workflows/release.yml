name: gg Image CI
permissions: {}

on:
  pull_request:
  push:
    branches:
    - 'master'

env:
  KO_DOCKER_REPO: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/gg

jobs:
  ci-test-and-release:
    runs-on: ${{ matrix.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            gg_witharch: gg-linux-x86_64
          - platform: linux/arm64
            gg_witharch: gg-linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          check-latest: true
          cache: false
          go-version-file: 'go.mod'

      - name: Test
        run: go test ./...

      - name: Test YAML compatibility module
        run: go -C compat/yamlv3 test ./...

      - name: Test downstream YAML API compatibility
        shell: bash
        run: |
          consumer_dir=$(mktemp -d)
          cp -R testdata/downstream/. "${consumer_dir}"
          go -C "${consumer_dir}" mod edit \
              -replace github.com/mzz2017/gg="${GITHUB_WORKSPACE}"
          go -C "${consumer_dir}" test -mod=mod ./...

      - name: pre-start
        shell: bash
        run: |
          curl() { $(type -P curl) -LRq --retry 5 --retry-delay 10 --retry-max-time 60 --fail "$@"; }
          curl -o '/tmp/.ko.yaml' -- \
              https://raw.githubusercontent.com/IceCodeNew/docker-collections/master/default.ko.yaml
      - uses: ko-build/setup-ko@61b4d1d396f5b2e7d6bb6fefdce3dc38d1a13445 # v0.10
      - run: ko build --local --platform ${{ matrix.platform }} --bare ./
        env:
          KO_CONFIG_PATH: /tmp/.ko.yaml

      -
        name: Smoke Test
        env:
          _GG_WITHARCH: ${{ matrix.gg_witharch }}
        run: |
          docker run --rm "${{ env.KO_DOCKER_REPO }}:latest" --help

          GG_BIN=$(
              sudo find /var/lib/docker/overlay2/ -type f -name gg -size +2000k -print | head -n 1
          )
          sudo install -pvD "${GG_BIN}" "/usr/local/bin/${_GG_WITHARCH}"
      -
        name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: github.event_name == 'push' && github.event.repository.default_branch == github.ref_name
        with:
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
          tag_name: latest
          files: /usr/local/bin/${{ matrix.gg_witharch }}
    permissions:
      contents: write
